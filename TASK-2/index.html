<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AuthFlow</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
<div class="container">

<a class="navbar-brand" href="#">
<i class="fa-solid fa-shield-halved"></i>
Authentify
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="#home">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#login">Login</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#register">Register</a>
</li>

</ul>
</div>

</div>
</nav>

<section id="home" class="hero">

<div class="container">

<div class="row align-items-center">

<div class="col-lg-6">

<h1>Secure Authentication Platform</h1>

<p>
Register your account and securely login using AuthFlow.
A simple and modern authentication website.
</p>

<a href="#register" class="btn btn-main">
Get Started
</a>

</div>

<div class="col-lg-6 text-center">
<i class="fa-solid fa-user-shield hero-icon"></i>
</div>

</div>

</div>

</section>

<section id="login" class="section bg-light">

<div class="container">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="form-box">

<h3 class="text-center mb-4">Login</h3>

<form id="loginForm">

<input
type="text"
id="loginUsername"
class="form-control mb-3"
placeholder="Username"
required>

<div class="input-group mb-3">

<input
type="password"
id="loginPassword"
class="form-control"
placeholder="Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('loginPassword')">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<button
type="submit"
class="btn btn-main w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

</section>

<section id="register" class="section">

<div class="container">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="form-box">

<h3 class="text-center mb-4">Register</h3>

<form id="registerForm">

<input
type="text"
id="username"
class="form-control mb-2"
placeholder="Username"
required>

<div id="userStatus" class="mb-2"></div>

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Email"
required>

<input
type="password"
id="password"
class="form-control mb-3"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
class="form-control mb-2"
placeholder="Confirm Password"
required>

<div id="matchMsg" class="mb-3"></div>

<button
type="submit"
class="btn btn-main w-100">

Register

</button>

</form>

</div>

</div>

</div>

</div>

</section>

<footer>
<p>© 2026 AuthFlow. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
