<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fff6ee;
font-family:Arial,sans-serif;
}

.card{
padding:40px;
border:none;
border-radius:15px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
color:#ffb36b;
}

.btn-main{
background:#ffb36b;
border:none;
color:white;
}

</style>

</head>

<body>

<div class="card">

<h1>AuthFlow</h1>

<h3 id="welcomeText"></h3>

<p>Login Successful 🎉</p>

<button
class="btn btn-main"
onclick="logout()">

Logout

</button>

</div>

<script>

const user =
localStorage.getItem(
"loggedInUser"
);

if(user){

document.getElementById(
"welcomeText"
).innerHTML =
"Hi, " + user;

}else{

window.location.href =
"index.html";

}

function logout(){

localStorage.removeItem(
"loggedInUser"
);

window.location.href =
"index.html";

}

</script>

</body>
</html>
